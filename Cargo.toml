[package]
name = "manual-rl"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
half = "2"
tiny_http = "0.12"
rayon = "1"

[profile.release]
debug = 1
