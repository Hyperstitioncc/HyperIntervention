<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANUAL·RL — token-level rollout surgery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #0a0b0f;       --panel: #101219;    --panel-2: #0c0e14;
  --line: #1c2029;     --line-2: #262c38;
  --ink: #ccd2de;      --ink-dim: #7b8494;  --ink-faint: #4a515f;
  --accent: #45c8ff;   --grad: #ffae57;
  --good: #46d0a6;     --bad: #ef6f6f;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --serif: "Fraunces", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: var(--mono); font-size: 12px; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(1100px 640px at 80% -10%, #13202b 0, transparent 55%),
    radial-gradient(820px 520px at 6% 110%, #151122 0, transparent 50%),
    linear-gradient(#0d0f15, #0a0b0f);
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #242b38; border-radius: 6px; }
::-webkit-scrollbar-track { background: #0c0e14; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

header.bar {
  display: flex; align-items: baseline; gap: 18px; padding: 12px 20px 11px;
  border-bottom: 1px solid var(--line); position: relative;
  background: linear-gradient(180deg, rgba(18,22,30,.6), transparent);
}
header.bar::after {
  content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 170px;
  background: linear-gradient(90deg, var(--accent), transparent);
}
.wordmark { font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: .5px; color: #eef2f8; }
.wordmark .dot { color: var(--accent); }
.tagline { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-dim); }
.meta { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.meta .kv { display: flex; flex-direction: column; line-height: 1.2; }
.meta .kv b { font-weight: 500; color: var(--ink); font-size: 11.5px; }
.meta .kv span { color: var(--ink-faint); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
.dot-i { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 7px currentColor; color: var(--bad); }
.dot-i.live { background: var(--good); color: var(--good); }
.loadbtn {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim);
  border: 1px solid var(--line-2); background: var(--panel); padding: 6px 10px; border-radius: 3px; cursor: pointer;
}
.loadbtn:hover { color: var(--accent); border-color: var(--accent); }
.loadbtn:disabled { opacity: .45; cursor: default; }
.loadbtn:disabled:hover { color: var(--ink-dim); border-color: var(--line-2); }
.loadbtn.write { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line-2)); }
.loadbtn.write:hover { color: #7ff0c8; border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }

main { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(300px, 360px); min-height: 0; overflow: hidden; }
#side { border-left: 1px solid var(--line); background: var(--panel-2); overflow-y: auto; padding: 12px 12px 40px; }
#side .head { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); padding: 0 2px 8px; }
#side .notes-head { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.notes .note { font-size: 10.5px; line-height: 1.5; color: var(--ink-dim); padding: 4px 2px; border-bottom: 1px solid var(--line); white-space: pre-wrap; }
.notes .note:first-child { color: var(--ink); }
#side .placeholder { color: var(--ink-faint); font-family: var(--serif); font-style: italic; font-size: 13px; line-height: 1.6; padding: 10px 2px; }

#list { border-right: 1px solid var(--line); background: var(--panel-2); overflow-y: auto; padding: 8px 0; }
#list .head {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint);
  padding: 4px 14px 8px;
}
#list .prob {
  padding: 4px 14px; cursor: pointer; font-size: 11px; color: var(--ink-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px;
}
#list .prob:hover { background: #11141b; color: var(--ink); }
#list .prob.cur { background: rgba(69,200,255,.08); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
#list .prob .n { color: var(--ink-faint); font-size: 9.5px; min-width: 22px; }
#list .badge {
  margin-left: auto; font-size: 9px; padding: 1px 7px; border-radius: 20px;
  color: var(--good); border: 1px solid rgba(70,208,166,.4); background: rgba(70,208,166,.08);
}

.stage { overflow-y: auto; overflow-x: hidden; min-width: 0; padding: 18px 26px 90px; }
.stage-in { max-width: 1020px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.prompt-ctx {
  font-family: var(--serif); font-size: 14.5px; line-height: 1.6; color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--ink-dim);
  border-radius: 8px; padding: 11px 14px 13px;
}
.prompt-ctx::before {
  content: "problem"; display: block;
  font-family: var(--mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-dim); margin-bottom: 7px;
}
.pmeta { font-size: 10px; color: var(--ink-faint); letter-spacing: .05em; display: flex; gap: 14px; align-items: baseline; }
.pmeta b { color: var(--ink-dim); font-weight: 500; }
.pmeta .ended { margin-left: auto; }
.pmeta .verdict { font-weight: 700; letter-spacing: .02em; }
.pmeta .verdict.ok { color: var(--good); }
.pmeta .verdict.no { color: var(--bad); }
.pmeta .ended.eos { color: var(--good); }
.pmeta .ended.trunc { color: var(--grad); }

.strip-wrap { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.strip-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 9px; }
.strip-head .hint { font-size: 11px; color: var(--ink-dim); }
.strip-head .hint b { color: var(--ink); font-weight: 700; }
.strip-head .hint b.u { color: var(--good); }
.strip-head .hint b.d { color: var(--accent); }
.strip { user-select: none; overflow-wrap: anywhere; }
.strip.prose { padding: 6px 8px; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; }
.seg button { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim); background: transparent; border: 0; padding: 4px 10px; cursor: pointer; transition: .12s; }
.seg button.on { color: var(--accent); background: rgba(69,200,255,.1); }
.seg button:not(.on):hover { color: var(--ink); }

.strip .w { color: var(--ink-dim); cursor: pointer; border-radius: 3px; padding: 0 1px; margin: 0 .5px; position: relative; transition: background .1s, box-shadow .1s; }
.strip.chips .w { box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.strip .w:hover { background: var(--line-2); }
.strip .w.sel { box-shadow: 0 0 0 2px var(--accent); }
.strip .w.sel:not(.fork):not(.reinf) { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.strip .w.fork { background: color-mix(in srgb, var(--good) 34%, transparent); color: #f2fff9; font-weight: 600; box-shadow: inset 0 -2px var(--good); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.strip .w.reinf { background: color-mix(in srgb, var(--accent) 26%, transparent); color: #eef8ff; font-weight: 600; box-shadow: inset 0 -2px var(--accent); }
.strip .w.eos { color: var(--ink-faint); }

.texbtn { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-dim); background: transparent; border: 1px solid var(--line-2); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
.texbtn.on { color: var(--accent); background: rgba(69,200,255,.1); }
.strip.tex { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--serif); font-size: 14.5px; line-height: 1.8; padding: 6px 8px; }
.strip.tex .w { padding: 0; margin: 0; border-radius: 0; }
.tx-math { font-family: "Times New Roman", "STIX Two Math", Times, serif; font-style: italic; font-size: 1.08em; }
.tx-upright { font-family: "Times New Roman", "STIX Two Math", Times, serif; font-style: normal; font-size: 1.08em; }
.tx-bold { font-weight: 700; }
.tx-code { font-family: var(--mono); font-size: 11px; line-height: 1.5; font-style: normal; color: var(--ink-dim); background: rgba(255,255,255,.035); }
.tx-sup { vertical-align: .45em; font-size: .74em; line-height: 0; }
.tx-sub { vertical-align: -.25em; font-size: .74em; line-height: 0; }
.tx-boxed { border-top: 1px solid var(--grad); border-bottom: 1px solid var(--grad); background: rgba(255,174,87,.08); }
.strip .empty { color: var(--ink-faint); font-style: italic; padding: 8px 4px; display: block; }

.alts-head { font-size: 11px; color: var(--ink); margin-bottom: 4px; line-height: 1.5; }
.alts-keys { color: var(--ink-faint); font-size: 10px; margin-bottom: 9px; line-height: 1.8; }
kbd { font-family: var(--mono); font-size: 9px; padding: 0 4px; margin-left: 2px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--ink-faint); background: #0c0e14; }
.yopt { display: flex; align-items: center; gap: 10px; padding: 3px 7px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.yopt:hover { background: var(--line); }
.yopt.cursor { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
.yopt.on .tk { color: var(--grad); font-weight: 700; }
.yopt .k { color: var(--ink-faint); font-size: 10px; min-width: 16px; text-align: right; }
.yopt .tk { flex: 0 0 120px; width: 120px; color: var(--ink); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.yopt .tk .real { color: var(--good); }
.yopt .tk .orig { color: var(--ink-faint); }
.yopt .barwrap { flex: 1; min-width: 30px; height: 6px; background: #13161d; border-radius: 2px; overflow: hidden; }
.yopt .bar { height: 100%; background: linear-gradient(90deg, #2b6f8f, var(--accent)); }
.yopt .pv { color: var(--ink-dim); min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
.yopt .bits { color: var(--ink-faint); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 10px; }
.unpick {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-dim); border: 1px solid var(--line-2); background: transparent;
  padding: 3px 10px; border-radius: 3px; cursor: pointer; margin-top: 8px;
}
.unpick:hover { color: var(--bad); border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }

.out { display: flex; flex-direction: column; gap: 8px; min-height: 26px; }
.status { font-size: 11px; color: var(--ink-dim); }
.status.err { color: var(--bad); }
.status.ok { color: var(--good); }
.status.work { color: var(--grad); }
.status.flash { animation: flash .5s 2; }
@keyframes flash { 50% { color: #fff; text-shadow: 0 0 6px var(--grad); } }
body.busy, body.busy * { cursor: progress !important; }
body.busy .strip, body.busy .alts { opacity: .45; }
body.busy .dot-i { background: var(--grad); color: var(--grad); animation: flash 1s infinite; }
#list .prob.loading { background: rgba(255,174,87,.1); color: var(--grad); box-shadow: inset 2px 0 0 var(--grad); }
#list .prob .spin { margin-left: auto; font-size: 10px; }
.empty-stage { white-space: pre-line; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-size: 10.5px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line-2);
  background: var(--panel); color: var(--ink-dim); font-variant-numeric: tabular-nums;
}
.chip b { color: var(--ink); font-weight: 500; }
.chip .up { color: var(--good); }
.chip .dn { color: var(--bad); }

.empty-stage { color: var(--ink-faint); font-family: var(--serif); font-style: italic; font-size: 14px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="wordmark">MANUAL<span class="dot">·</span>RL</span>
    <span class="tagline">steer the rollout token by token — then train on the corrections</span>
    <div class="meta">
      <span class="dot-i" id="conn" title="server"></span>
      <div class="kv"><b id="round">—</b><span>round</span></div>
      <div class="kv"><b id="pending">0</b><span>picks</span></div>
      <button class="loadbtn" id="stop" title="end the generation where it is (the answer keeps what was written)" disabled>■ stop</button>
      <button class="loadbtn" id="regen" title="fresh rollout for this problem (drops its picks)">⟲ regenerate</button>
      <button class="loadbtn write" id="apply" title="train on every pick across problems, checkpoint, regenerate">⚙ apply gradient</button>
    </div>
  </header>

  <main>
    <aside id="list"><div class="head">problems</div><div id="probs"></div></aside>
    <section class="stage"><div class="stage-in">
      <div class="prompt-ctx" id="prompt" style="display:none"></div>
      <div class="pmeta" id="pmeta" style="display:none"></div>
      <div class="strip-wrap" id="strip-wrap" style="display:none">
        <div class="strip-head">
          <div class="seg" id="viewseg">
            <button data-v="readable">readable</button>
            <button data-v="tokens">tokens</button>
            <button data-v="surprisal" class="on">surprisal</button>
            <button data-v="entropy" title="colour = entropy of the model's distribution at each token (where it was unsure)">entropy</button>
          </div>
          <button class="texbtn" id="texbtn" title="draw TeX (off = raw source)">latex</button>
          <span class="hint">click any token → its candidates appear on the right → click one to <b class="u">fork</b>, or the realized one to <b class="d">reinforce</b></span>
        </div>
        <div class="strip" id="strip"></div>
      </div>
      <div class="out">
        <div class="stats" id="stats"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="empty-stage" id="empty">pick a problem on the left — the model answers, you correct it.</div>
    </div></section>
    <aside id="side"><div class="head">candidates</div><div class="alts" id="alts"></div>
      <div class="head notes-head">editor log</div><div id="notes" class="notes"></div></aside>
  </main>
</div>

<script>
"use strict";

const lerp = (a, b, t) => a + (b - a) * t;
const hexToRgb = h => { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); };
function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < stops.length - 1; i++) {
    if (t <= stops[i+1][0]) {
      const [p0,c0] = stops[i], [p1,c1] = stops[i+1];
      const u = (t - p0) / ((p1 - p0) || 1), a = hexToRgb(c0), b = hexToRgb(c1);
      return `rgb(${a.map((v,k) => Math.round(lerp(v,b[k],u))).join(',')})`;
    }
  }
  return `rgb(${hexToRgb(stops.at(-1)[1]).join(',')})`;
}
function entropyColor(h) {
  return ramp([[0,'#4a5160'],[.35,'#5f8fb0'],[1,'#7fe0ff']], Math.min(1, h / Math.LN2 / 3));
}
function surprisalColor(p) {
  const bits = -Math.log2(Math.max(p, 1e-6));
  return ramp([[0,'#5a6172'],[.4,'#b79a6e'],[1,'#ffd27a']], Math.min(1, bits / 1.5));
}
const bits = p => (p > 0 ? -Math.log2(p) : 0);
const disp = t => (t === '' ? '∅' : t.replace(/\n/g, '⏎').replace(/<\|(.+?)\|>/g, '⟨$1⟩'));
const fmtPct = x => (x * 100).toFixed(x < 0.01 ? 2 : 1) + '%';
const fmtNats = x => (x >= 0 ? '+' : '') + x.toFixed(2);
const fmtLr = x => x.toExponential(0);

const SYM = new Map(Object.entries({
  cdot: "·", times: "×", div: "÷", pm: "±", mp: "∓", leq: "≤", le: "≤", geq: "≥", ge: "≥", neq: "≠", ne: "≠",
  approx: "≈", equiv: "≡", sim: "∼", cong: "≅", propto: "∝", infty: "∞", to: "→", rightarrow: "→",
  leftarrow: "←", Rightarrow: "⇒", implies: "⟹", iff: "⟺", Leftrightarrow: "⇔", mapsto: "↦", in: "∈",
  notin: "∉", subset: "⊂", subseteq: "⊆", supset: "⊃", cup: "∪", cap: "∩", emptyset: "∅", varnothing: "∅",
  forall: "∀", exists: "∃", neg: "¬", land: "∧", lor: "∨", wedge: "∧", vee: "∨", angle: "∠", triangle: "△",
  parallel: "∥", perp: "⊥", circ: "∘", degree: "°", sum: "∑", prod: "∏", int: "∫", partial: "∂", nabla: "∇",
  ldots: "…", cdots: "⋯", dots: "…", vdots: "⋮", ddots: "⋱", prime: "′", mid: "∣", nmid: "∤", lfloor: "⌊",
  rfloor: "⌋", lceil: "⌈", rceil: "⌉", langle: "⟨", rangle: "⟩",
  alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", varepsilon: "ε", zeta: "ζ", eta: "η",
  theta: "θ", vartheta: "ϑ", iota: "ι", kappa: "κ", lambda: "λ", mu: "μ", nu: "ν", xi: "ξ", pi: "π",
  rho: "ρ", sigma: "σ", tau: "τ", upsilon: "υ", phi: "φ", varphi: "φ", chi: "χ", psi: "ψ", omega: "ω",
  Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π", Sigma: "Σ", Phi: "Φ", Psi: "Ψ",
  Omega: "Ω", quad: "  ", qquad: "    ", ";": " ", ":": " ", ",": "", "!": "", " ": " ", "\\": " ",
  "{": "{", "}": "}", "$": "$", "%": "%", "&": "&", "#": "#", "_": "_", "|": "‖", cr: " ",
  displaystyle: "", textstyle: "", limits: "", nolimits: "", middle: "",
}));
const FUNCS = new Set(("sin cos tan cot sec csc arcsin arccos arctan sinh cosh tanh log ln lg exp lim max min " +
  "sup inf gcd lcm det deg mod bmod pmod arg dim ker Pr").split(" "));
const SIZERS = new Set("left right big Big bigg Bigg bigl bigr Bigl Bigr biggl biggr".split(" "));
const TEXTISH = new Set(("text textbf textit textrm mathrm mathbf mathit mathsf mathtt operatorname mbox mathbb " +
  "mathcal boldsymbol bm overline underline hat bar vec tilde widehat overrightarrow").split(" "));
const SIMPLE = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.";
const DELIMS = [["\\(", "\\)"], ["\\[", "\\]"], ["$$", "$$"], ["$", "$"]];
const DISPLAY_ENVS = new Set(["align", "align*", "equation", "equation*", "gather", "gather*", "eqnarray",
  "eqnarray*", "multline", "multline*", "displaymath", "flalign", "flalign*", "alignat", "alignat*"]);
const ENV_OPEN = { pmatrix: "(", bmatrix: "[", Bmatrix: "{", vmatrix: "|", Vmatrix: "‖", cases: "{ ", smallmatrix: "(" };
const ENV_CLOSE = { pmatrix: ")", bmatrix: "]", Bmatrix: "}", vmatrix: "|", Vmatrix: "‖", smallmatrix: ")" };
const MATRIX_ENVS = new Set(["matrix", "pmatrix", "bmatrix", "Bmatrix", "vmatrix", "Vmatrix", "smallmatrix", "array"]);
const isAlpha = c => c !== undefined && /\p{L}/u.test(c);

class Tex {
  constructor(src) { this.src = src; this.out = []; this.envs = []; this.run(); }
  emit(s, e, text, tags) { this.out.push([s, e, text, tags, text === this.src.slice(s, e)]); }
  run() {
    const src = this.src, n = src.length;
    let i = 0, bold = false, run = 0;
    const flush = upto => { if (upto > run) this.emit(run, upto, src.slice(run, upto), bold ? ["bold"] : []); };
    while (i < n) {
      const d = DELIMS.find(([op]) => src.startsWith(op, i));
      const env = src.startsWith("\\begin{", i) && src.slice(i + 7, src.indexOf("}", i));
      if (env && DISPLAY_ENVS.has(env)) {
        flush(i);
        const close = `\\end{${env}}`, j = src.indexOf(close, i);
        const end = j < 0 ? n : j + close.length;
        this.seq(i, end, ["math"]);
        i = run = end;
      } else if (src.startsWith("[asy]", i)) {
        flush(i);
        const j = src.indexOf("[/asy]", i), end = j < 0 ? n : j + 6;
        this.emit(i, end, src.slice(i, end), ["code"]);
        i = run = end;
      } else if (d) {
        const [op, cl] = d;
        flush(i);
        const j = src.indexOf(cl, i + op.length), end = j < 0 ? n : j;
        this.emit(i, i + op.length, "", []);
        this.seq(i + op.length, end, ["math"]);
        if (j >= 0) this.emit(j, j + cl.length, "", []);
        i = run = j < 0 ? n : j + cl.length;
      } else if (src.startsWith("**", i)) {
        flush(i);
        this.emit(i, i + 2, "", []);
        bold = !bold; i += 2; run = i;
      } else i++;
    }
    flush(n);
  }
  seq(i, end, tags, stop = false) {
    while (i < end) {
      if (stop && this.src[i] === "}") return i;
      i = this.atom(i, end, tags);
    }
    return i;
  }
  closeOf(i, end) {
    let d = 0, k = i;
    while (k < end) {
      const c = this.src[k];
      if (c === "\\") { k += 2; continue; }
      d += c === "{" ? 1 : c === "}" ? -1 : 0;
      if (d === 0) return k;
      k++;
    }
    return end;
  }
  group(i, end, tags, open = "", close = "") {
    this.emit(i, i + 1, open, tags);
    const j = this.seq(i + 1, end, tags, true);
    if (j < end) { this.emit(j, j + 1, close, tags); return j + 1; }
    return j;
  }
  arg(i, end, tags, open = "", close = "", wrap = false) {
    while (i < end && this.src[i] === " ") { this.emit(i, i + 1, "", tags); i++; }
    if (i >= end) return i;
    if (this.src[i] === "{") {
      if (wrap) {
        const inner = this.src.slice(i + 1, this.closeOf(i, end)).trim();
        const simple = inner && ([...inner].every(c => SIMPLE.includes(c)) || (inner[0] === "\\" && /^\p{L}+$/u.test(inner.slice(1))));
        if (!simple) { open += "("; close = ")" + close; }
      }
      return this.group(i, end, tags, open, close);
    }
    if (open) this.emit(i, i, open, tags);
    let j;
    if ("\\^_".includes(this.src[i])) j = this.atom(i, end, tags);
    else { this.emit(i, i + 1, this.src[i], tags); j = i + 1; }
    if (close) this.emit(j, j, close, tags);
    return j;
  }
  atom(i, end, tags) {
    const src = this.src, c = src[i];
    if (c === "{") return this.group(i, end, tags);
    if (c === "^" || c === "_") {
      if (c === "^" && src.startsWith("\\circ", i + 1)) { this.emit(i, i + 6, "°", tags); return i + 6; }
      this.emit(i, i + 1, "", tags);
      return this.arg(i + 1, end, [...tags, c === "^" ? "sup" : "sub"]);
    }
    if (c === "\\") {
      let j = i + 1;
      if (j < end && isAlpha(src[j])) { while (j < end && isAlpha(src[j])) j++; }
      else j = Math.min(j + 1, end);
      return this.command(src.slice(i + 1, j), i, j, end, tags);
    }
    if (c === "&" && tags.includes("math")) {
      this.emit(i, i + 1, this.envs.some(e => MATRIX_ENVS.has(e)) ? "  " : " ", tags);
      return i + 1;
    }
    let j = i + 1;
    while (j < end && !"{}^_\\&".includes(src[j])) j++;
    this.emit(i, j, src.slice(i, j), tags);
    return j;
  }
  command(name, i, j, end, tags) {
    if ((name === "begin" || name === "end") && this.src[j] === "{") {
      const k = this.closeOf(j, end), env = this.src.slice(j + 1, k);
      let e = Math.min(k + 1, end);
      if (name === "begin") {
        this.envs.push(env);
        if (env === "array" && this.src[e] === "{") e = Math.min(this.closeOf(e, end) + 1, end);
        if (env.startsWith("alignat") && this.src[e] === "{") e = Math.min(this.closeOf(e, end) + 1, end);
        this.emit(i, e, ENV_OPEN[env] || "", tags);
      } else {
        this.envs.pop();
        this.emit(i, e, ENV_CLOSE[env] || "", tags);
      }
      return e;
    }
    if (name === "\\") {
      const top = this.envs.at(-1);
      this.emit(i, j, MATRIX_ENVS.has(top) ? "; " : top ? "\n" : " ", tags);
      if (top && this.src[j] === "\n") { this.emit(j, j + 1, "", tags); j++; }
      return j;
    }
    if (["frac", "dfrac", "tfrac", "cfrac"].includes(name)) {
      this.emit(i, j, "", tags);
      const k = this.arg(j, end, tags, "", "", true);
      return this.arg(k, end, tags, "/", "", true);
    }
    if (name === "binom") {
      this.emit(i, j, "C(", tags);
      const k = this.arg(j, end, tags);
      return this.arg(k, end, tags, ", ", ")");
    }
    if (name === "sqrt") {
      this.emit(i, j, "√", tags);
      if (j < end && this.src[j] === "[") {
        let m = this.src.indexOf("]", j);
        if (m < 0 || m >= end) m = end - 1;
        this.emit(j, m + 1, this.src.slice(j + 1, m), [...tags, "sup"]);
        j = m + 1;
      }
      return this.arg(j, end, tags, "", "", true);
    }
    if (name === "boxed") {
      this.emit(i, j, "", tags);
      return this.arg(j, end, [...tags, "boxed"], " ", " ");
    }
    if (TEXTISH.has(name)) {
      this.emit(i, j, "", tags);
      const extra = name.includes("bf") || name === "boldsymbol" || name === "bm" ? ["bold"] : [];
      const t = /^(text|math|op|mbox)/.test(name) ? [...tags.filter(x => x !== "math"), "upright", ...extra] : tags;
      return this.arg(j, end, t);
    }
    if (SIZERS.has(name)) {
      this.emit(i, j, "", tags);
      if (j < end && this.src[j] === ".") { this.emit(j, j + 1, "", tags); j++; }
      return j;
    }
    if (SYM.has(name)) { this.emit(i, j, SYM.get(name), tags); return j; }
    if (FUNCS.has(name)) { this.emit(i, j, name, [...tags, "upright"]); return j; }
    this.emit(i, j, this.src.slice(i, j), tags);
    return j;
  }
}

const texClass = tags => tags.map(t => 'tx-' + t).join(' ');

function renderTexInto(box, text) {
  box.innerHTML = '';
  for (const [, , t, tags] of new Tex(text).out) if (t) box.append(el('span', texClass(tags) || null, t));
}

function lastBoxed(s) {
  const i = s.lastIndexOf('\\boxed'), j = i < 0 ? -1 : s.indexOf('{', i);
  if (j < 0) return null;
  for (let k = j, d = 0; k < s.length; k++) {
    d += s[k] === '{' ? 1 : s[k] === '}' ? -1 : 0;
    if (d === 0) return s.slice(j + 1, k);
  }
  return null;
}
function canonAns(s) {
  s = s.replace(/\\(?:left|right|displaystyle|bigl?|bigr?|Bigl?|Bigr?)(?![a-zA-Z])/g, '')
    .replace(/\\[!,;: ]/g, '').replace(/\\[dt]frac/g, '\\frac').replace(/\\(?:mbox|mathrm|textbf|text)\{([^{}]*)\}/g, '$1')
    .replace(/\^\s*\{?\\circ\}?|\\circ|°|\\%|%|\\\$|\$/g, '').replace(/\s+/g, '').replace(/\.$/, '');
  s = s.replace(/\\sqrt(\w)/g, '\\sqrt{$1}').replace(/\\frac(\w)(\w)/g, '\\frac{$1}{$2}')
    .replace(/\\frac(\w)\{/g, '\\frac{$1}{').replace(/\\frac(\{[^{}]*\})(\w)/g, '\\frac$1{$2}');
  return s.replace(/^[a-zA-Z](?:_\w|_\{\w+\})?=(?!=)/, '');
}
function numAns(s) {
  s = s.replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
  let m;
  if ((m = s.match(/^([+-]?)\\frac\{?([\d.]+)\}?\{?([\d.]+)\}?$/))) return (m[1] === '-' ? -1 : 1) * m[2] / m[3];
  if ((m = s.match(/^([+-]?[\d.]+)\/([\d.]+)$/))) return m[1] / m[2];
  if (/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/.test(s)) return +s;
  return null;
}
function splitTop(s) {
  const out = []; let d = 0, cur = '';
  for (const c of s) {
    if ('([{'.includes(c)) d++; else if (')]}'.includes(c)) d--;
    if (c === ',' && d === 0) { out.push(cur); cur = ''; } else cur += c;
  }
  return [...out, cur];
}
function sameAns(a, b) {
  a = canonAns(a); b = canonAns(b);
  if (a === b) return true;
  const strip = x => x.replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
  if (strip(a) === strip(b)) return true;
  const na = numAns(a), nb = numAns(b);
  if (na !== null && nb !== null) return Math.abs(na - nb) <= 1e-6 * Math.max(1, Math.abs(nb));
  const noUnits = x => x.replace(/\\text\{[^{}]*\}|\\(?:mbox|mathrm)\{[^{}]*\}|[a-zA-Z]+$/g, '');
  const ua = numAns(noUnits(a)), ub = numAns(noUnits(b));
  if (ua !== null && ub !== null && (na === null || nb === null)) return Math.abs(ua - ub) <= 1e-6 * Math.max(1, Math.abs(ub));
  const br = /^([([])(.*)([)\]])$/;
  const ma = a.match(br), mb = b.match(br);
  if (ma && mb) {
    if (ma[1] !== mb[1] || ma[3] !== mb[3]) return false;
    const xa = splitTop(ma[2]), xb = splitTop(mb[2]);
    return xa.length > 1 && xa.length === xb.length && xa.every((x, i) => sameAns(x, xb[i]));
  }
  const xa = splitTop(strip(a)), xb = splitTop(strip(b));
  if (xa.length > 1 && xa.length === xb.length) {
    const left = [...xb];
    return xa.every(x => { const k = left.findIndex(y => sameAns(x, y)); return k >= 0 && left.splice(k, 1); });
  }
  return false;
}

let S = null;
let sel = null;
let cursor = 0;
let busy = false;
let loadingIdx = null;
let seenVersion = -1, remoteBusy = false;
let viewMode = localStorage.getItem('mrl-view') || 'surprisal';
let texOn = localStorage.getItem('mrl-tex') !== 'off';

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

async function api(path, body = {}, working = '') {
  if (busy) { flashBusy(); return null; }
  busy = true; syncButtons();
  document.body.classList.add('busy');
  status('⏳ ' + (working || 'working…'), 'work');
  $('conn').classList.remove('live');
  const poll = setInterval(() => progress(working || 'working'), 700);
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const v = await r.json();
    if (!r.ok) { status(v.error || 'request failed', 'err'); return null; }
    S = v;
    seenVersion = v.version;
    $('conn').classList.add('live');
    status('');
    render();
    return v;
  } catch (e) {
    status(String(e) + ' (is the ssh tunnel up?)', 'err');
    return null;
  } finally {
    clearInterval(poll);
    busy = false; loadingIdx = null;
    document.body.classList.remove('busy');
    syncButtons();
    if (S) renderList();
  }
}

async function progress(working) {
  try {
    const p = await (await fetch('/api/progress', { method: 'POST', body: '{}' })).json();
    if (!busy || !p.generating) return;
    const tail = p.tail.replace(/\s+/g, ' ').slice(-90);
    status(`⏳ ${working} — ${p.tokens} / ${p.budget} tokens   …${tail}`, 'work');
    if ($('empty').style.display !== 'none') $('empty').textContent = `${working}\n${p.tokens} / ${p.budget} tokens\n\n…${p.tail}`;
  } catch (e) {  }
}

function flashBusy() {
  const s = $('status');
  s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash');
}

const GEN_NOTE = 'the model writes at ~70 tokens/s: most answers take 5–15 s, one that runs to the 4096-token cap about a minute';

function status(msg, kind = '') {
  const s = $('status');
  s.textContent = msg || '';
  s.className = 'status' + (kind ? ' ' + kind : '');
}

function showWaiting(msg) {
  for (const id of ['prompt', 'pmeta', 'strip-wrap']) $(id).style.display = 'none';
  $('empty').style.display = '';
  $('empty').textContent = msg + '\n' + GEN_NOTE + '.';
  $('alts').innerHTML = '';
}

function syncButtons() {
  $('stop').disabled = !busy;
  $('apply').disabled = busy || !S || !S.pending_picks;
  $('regen').disabled = busy || !S || !S.draft;
}

function render() {
  $('round').textContent = S.round;
  $('pending').textContent = S.pending_picks;
  renderList(); renderDraft(); renderStats(); renderNotes(); syncButtons();
}

function renderList() {
  const box = $('probs');
  box.innerHTML = '';
  for (const p of S.problems) {
    const loading = loadingIdx === p.idx;
    const row = el('div', 'prob' + (loading ? ' loading' : loadingIdx === null && S.draft && S.draft.idx === p.idx ? ' cur' : ''));
    row.append(el('span', 'n', String(p.idx)));
    row.append(el('span', null, String(p.id)));
    if (loading) row.append(el('span', 'spin', '⏳'));
    else if (p.picks) row.append(el('span', 'badge', p.picks + (p.picks === 1 ? ' pick' : ' picks')));
    row.onclick = () => {
      if (busy) return flashBusy();
      if (S.draft && S.draft.idx === p.idx) return;
      sel = null; loadingIdx = p.idx;
      renderList();
      showWaiting(`generating the model's answer to ${p.id}…`);
      api('/api/open', { idx: p.idx }, `generating ${p.id}`);
    };
    box.append(row);
  }
}

const ENDED = { eos: ['⟨eos⟩', 'eos'], max_tokens: ['max tokens', 'trunc'], stopped: ['stopped', 'trunc'] };

function renderDraft() {
  const d = S.draft;
  $('empty').style.display = d ? 'none' : '';
  for (const id of ['prompt', 'pmeta', 'strip-wrap']) $(id).style.display = d ? '' : 'none';
  if (!d) return renderAlts(d);

  if (texOn) renderTexInto($('prompt'), d.prompt);
  else $('prompt').textContent = d.prompt;
  const meta = $('pmeta');
  meta.innerHTML = '';
  meta.append(el('span', null, 'id '));
  meta.lastChild.append(el('b', null, String(d.id)));
  meta.append(el('span', null, d.tokens.length + ' tokens'));
  meta.append(el('span', null, d.picks.length + (d.picks.length === 1 ? ' pick' : ' picks')));
  if (d.extra && Object.keys(d.extra).length) {
    meta.append(el('span', null, Object.entries(d.extra).map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join('  ')));
  }
  const ref = d.extra && d.extra.answer, got = lastBoxed(d.tokens.map(t => t.text).join(''));
  if (ref != null) {
    const ok = got != null && sameAns(got, ref);
    meta.append(el('span', 'verdict ' + (ok ? 'ok' : 'no'),
      got == null ? '✗ no \\boxed answer' : ok ? `✓ ${got} matches reference` : `✗ boxed ${got} ≠ reference ${ref}`));
  }
  const [etxt, ecls] = ENDED[d.ended_by] || [String(d.ended_by), ''];
  meta.append(el('span', 'ended ' + ecls, 'ended: ' + etxt));

  renderStrip(d);
  renderAlts(d);
}

function renderStrip(d) {
  const strip = $('strip'), stage = document.querySelector('.stage'), y = stage.scrollTop;
  strip.innerHTML = '';
  const tex = texOn && viewMode !== 'tokens';
  strip.className = 'strip' + (tex ? ' tex' : viewMode === 'readable' ? ' prose' : viewMode === 'tokens' ? ' chips' : '');
  if (!d.tokens.length) { strip.append(el('span', 'empty', '∅ — empty completion')); return; }
  const picks = new Map(d.picks.map(p => [p.pos, p]));
  const pieces = tex ? texPieces(d.tokens) : d.tokens.map((t, i) => [i, viewMode === 'tokens' ? disp(t.text) : t.text, []]);
  const shown = new Set(pieces.map(p => p[0]));
  const proxy = new Map();
  for (const i of [...picks.keys(), sel]) {
    if (i === null || shown.has(i)) continue;
    const p = pieces.find(p => p[0] > i);
    if (p) proxy.set(p[0], i);
  }
  for (const [i, text, tags] of pieces) {
    const t = d.tokens[i];
    const w = el('span', 'w', text);
    if (tags.length) w.className += ' ' + texClass(tags);
    w.dataset.pos = i;
    const pk = picks.get(i) || picks.get(proxy.get(i));
    if (pk) w.classList.add(pk.token === pk.original ? 'reinf' : 'fork');
    if (t.top.length && t.top[0].token === t.id && /^<\|.*\|>$/.test(t.text.trim())) w.classList.add('eos');
    if (viewMode === 'surprisal' && !pk) w.style.color = surprisalColor(t.prob);
    if (viewMode === 'entropy' && !pk) w.style.color = entropyColor(t.entropy || 0);
    if (i === sel || (sel !== null && proxy.get(i) === sel)) w.classList.add('sel');
    w.title = `p = ${fmtPct(t.prob)}  (${bits(t.prob).toFixed(2)} bits)`;
    w.onmousedown = e => { e.preventDefault(); select(sel === i ? null : i); };
    strip.append(w);
  }
  stage.scrollTop = y;
}

function select(i, scroll = false) {
  sel = i; cursor = 0;
  const ws = [...$('strip').children];
  ws.forEach(w => w.classList.remove('sel'));
  if (i !== null) {
    let hit = ws.filter(w => +w.dataset.pos === i);
    if (!hit.length) { const w = ws.find(w => +w.dataset.pos > i); hit = w ? [w] : []; }
    hit.forEach(w => w.classList.add('sel'));
    if (scroll && hit.length) hit[0].scrollIntoView({ block: 'nearest' });
  }
  renderAlts(S.draft);
}

function texPieces(tokens) {
  const texts = tokens.map(t => t.text || '​');
  const starts = [0];
  for (const x of texts) starts.push(starts.at(-1) + x.length);
  const owner = s => {
    let lo = 0, hi = tokens.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (starts[m] <= s) lo = m; else hi = m - 1; }
    return lo;
  };
  const out = [];
  for (const [s, e, text, tags, plain] of new Tex(texts.join('')).out) {
    if (!text) continue;
    if (!plain) { out.push([owner(s), text, tags]); continue; }
    for (let k = owner(s); k < tokens.length && starts[k] < e; k++) {
      const lo = Math.max(s, starts[k]), hi = Math.min(e, starts[k + 1]);
      if (lo < hi) out.push([k, text.slice(lo - s, hi - s), tags]);
    }
  }
  return out;
}

function renderAlts(d) {
  const box = $('alts');
  box.innerHTML = '';
  if (!d || sel === null || sel >= d.tokens.length) {
    box.append(el('div', 'placeholder', d ? 'Click any token in the answer to see what the model could have written there.' : 'Open a problem on the left.'));
    return;
  }
  const t = d.tokens[sel];
  const pk = d.picks.find(p => p.pos === sel);

  const head = el('div', 'alts-head');
  head.append(el('span', null,
    `position ${sel}: realized “${disp(t.text)}” at ${fmtPct(t.prob)} · entropy ${((t.entropy || 0) / Math.LN2).toFixed(2)} bits` +
    (pk ? (pk.token === pk.original ? ' · reinforced' : ` · forked from ${disp(pk.original_text)}`) : '')));
  box.append(head);
  const keys = el('div', 'alts-keys');
  keys.innerHTML = '<kbd>←</kbd><kbd>→</kbd> token <kbd>↑</kbd><kbd>↓</kbd> candidate <kbd>⏎</kbd> or <kbd>1</kbd>–<kbd>9</kbd> pick <kbd>u</kbd> unpick <kbd>esc</kbd> close';
  box.append(keys);

  t.top.forEach((c, j) => {
    const row = el('div', 'yopt' + (j === cursor ? ' cursor' : '') + (c.token === t.id ? ' on' : ''));
    row.append(el('span', 'k', String(j + 1)));
    const tk = el('span', 'tk');
    tk.textContent = disp(c.text) + ' ';
    if (c.token === t.id) tk.append(el('span', 'real', '● realized'));
    else if (pk && c.token === pk.original) tk.append(el('span', 'orig', '○ original'));
    row.append(tk);
    const bw = el('div', 'barwrap');
    const bar = el('div', 'bar');
    bar.style.width = Math.max(1.5, c.prob * 100) + '%';
    bw.append(bar);
    row.append(bw);
    row.append(el('span', 'pv', fmtPct(c.prob)));
    row.append(el('span', 'bits', bits(c.prob).toFixed(2) + ' b'));
    row.onmouseenter = () => { cursor = j; box.querySelectorAll('.yopt').forEach((r, k) => r.classList.toggle('cursor', k === j)); };
    row.onclick = () => pickCand(d, c);
    box.append(row);
  });

  if (pk) {
    const u = el('button', 'unpick', '✕ unpick — restore what was here before');
    u.onclick = () => api('/api/unpick', { pos: sel }, 'restoring…');
    box.append(u);
  }
}

function pickCand(d, c) {
  const fork = c.token !== d.tokens[sel].id;
  api('/api/pick', { pos: sel, token: c.token }, fork ? `forking at ${sel} from “${disp(c.text)}”: rewriting the rest` : 'reinforcing…');
}

function renderNotes() {
  const box = $('notes');
  box.innerHTML = '';
  const ns = (S.notes || []).slice(-60).reverse();
  if (!ns.length) box.append(el('div', 'placeholder', 'Notes from an LLM editor appear here while it works.'));
  for (const n of ns) box.append(el('div', 'note', n.text));
}

function renderStats() {
  const box = $('stats');
  box.innerHTML = '';
  const st = S.last_stats;
  if (!st) return;
  const chip = (label, html) => {
    const c = el('span', 'chip');
    c.innerHTML = label + ' <b>' + html + '</b>';
    box.append(c);
  };
  chip('margin', `${fmtNats(st.margin_before)} → <span class="${st.margin_after > st.margin_before ? 'up' : 'dn'}">${fmtNats(st.margin_after)}</span>`);
  chip('pair loss', st.pair_loss.toFixed(3));
  chip('margins up', fmtPct(st.margin_up));
  if (st.sft_logp_before !== 0 || st.sft_logp_after !== 0)
    chip('sft logp', `${st.sft_logp_before.toFixed(3)} → ${st.sft_logp_after.toFixed(3)}`);
  if (st.forced_logp_before !== 0 || st.forced_logp_after !== 0)
    chip('forced logp', `${st.forced_logp_before.toFixed(2)} → ${st.forced_logp_after.toFixed(2)}`);
  chip('round', `${st.episodes} ep · ${st.pairs} pairs · ${st.steps} steps · lr ${fmtLr(st.lr)}`);
}

$('viewseg').addEventListener('click', e => {
  const v = e.target.dataset && e.target.dataset.v;
  if (!v) return;
  viewMode = v;
  localStorage.setItem('mrl-view', v);
  for (const b of $('viewseg').children) b.classList.toggle('on', b.dataset.v === v);
  if (S && S.draft) renderStrip(S.draft);
});
for (const b of $('viewseg').children) b.classList.toggle('on', b.dataset.v === viewMode);
$('texbtn').classList.toggle('on', texOn);
$('texbtn').onclick = () => {
  texOn = !texOn;
  localStorage.setItem('mrl-tex', texOn ? 'on' : 'off');
  $('texbtn').classList.toggle('on', texOn);
  if (S && S.draft) renderDraft();
};

$('stop').onclick = () => {
  status('⏳ stopping…', 'work');
  fetch('/api/stop', { method: 'POST', body: '{}' }).catch(() => {});
};
$('regen').onclick = () => {
  if (busy) return flashBusy();
  if (S.draft.picks.length && !confirm('Drop the picks on this problem and regenerate?')) return;
  sel = null; showWaiting('regenerating…'); api('/api/regenerate', {}, 'regenerating');
};
$('apply').onclick = async () => {
  if (busy) return flashBusy();
  if (!confirm(`Apply the gradient on ${S.pending_picks} pick(s)? Every answer is regenerated from the new weights.`)) return;
  sel = null;
  const v = await api('/api/apply', {}, 'training on the picks, checkpointing, then regenerating…');
  if (v) status(`round ${v.round - 1} trained + checkpointed — answers regenerated from the new weights`, 'ok');
};

document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const d = S && S.draft;
  if (e.key === 'Escape') { if (d) select(null); return; }
  if (!d || !d.tokens.length) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const dir = e.key === 'ArrowLeft' ? -1 : 1;
    e.preventDefault();
    select(sel === null ? 0 : Math.max(0, Math.min(d.tokens.length - 1, sel + dir)), true);
  } else if (sel !== null && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const n = d.tokens[sel].top.length;
    if (n) { cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; e.preventDefault(); renderAlts(d); }
  } else if (sel !== null && (e.key === 'Enter' || /^[1-9]$/.test(e.key))) {
    const c = d.tokens[sel].top[e.key === 'Enter' ? cursor : +e.key - 1];
    if (c) { e.preventDefault(); pickCand(d, c); }
  } else if (sel !== null && e.key === 'u') {
    api('/api/unpick', { pos: sel }, 'restoring…');
  }
});

api('/api/state');

setInterval(async () => {
  if (busy || !S) return;
  try {
    const p = await (await fetch('/api/progress', { method: 'POST', body: '{}' })).json();
    if (busy) return;
    if (p.generating) {
      remoteBusy = true;
      status(`⏳ another client (the editor?) is generating — ${p.tokens} / ${p.budget} tokens   …${p.tail.replace(/\s+/g, ' ').slice(-80)}`, 'work');
      return;
    }
    if (remoteBusy) { remoteBusy = false; status(''); }
    if (p.version !== seenVersion) {
      const v = await (await fetch('/api/state', { method: 'POST', body: '{}' })).json();
      if (busy || v.error) return;
      const moved = !S.draft || !v.draft || S.draft.idx !== v.draft.idx || S.draft.gen !== v.draft.gen;
      S = v; seenVersion = v.version;
      if (moved) sel = null;
      render();
      if (sel !== null) renderAlts(S.draft);
    }
  } catch (e) {  }
}, 1500);
</script>
</body>
</html>
